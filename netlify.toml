# Ρυθμίσεις Netlify: στατική σελίδα, χωρίς build.
[build]
  publish = "."

# Ασφάλεια για όλες τις σελίδες
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Εικόνες: αλλάζουν σπάνια, ο browser τις κρατά 30 ημέρες
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Τα αρχεία του φακέλου tools/ (δημιουργία σελίδων) δεν χρειάζεται να είναι δημόσια
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

# Σύντομη διεύθυνση για κριτικές (τυπώνεται στο QR code της κάρτας).
# Οδηγεί στη φόρμα κριτικής του Google Business Profile (g.page/r/.../review).
# Αν αλλάξει ο σύνδεσμος, αλλάζει μόνο το "to". Τα τυπωμένα QR codes δεν χρειάζεται να αλλάξουν.
[[redirects]]
  from = "/kritiki"
  to = "https://g.page/r/CXj9fTBK4nNHEAE/review"
  status = 302
  force = true
